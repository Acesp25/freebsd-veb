name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Kernel panic may hang vm (once we add the tests to the CI), set 5 min time limit
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - freebsd_version: "15.0"
    name: FreeBSD ${{ matrix.freebsd_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Start FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.freebsd_version }}
          usesh: true
          sync: sshfs
      - name: Setup Environment
        shell: freebsd {0}
        run: |
          set -e
          fetch -o /tmp/src.txz \
            "https://download.freebsd.org/releases/$(uname -m)/$(uname -r | sed 's/-p[0-9]*$//')/src.txz"
          tar -C / -xf /tmp/src.txz usr/src/sys
      - name: Build Driver
        shell: freebsd {0}
        run: |
          set -e
          WS=$(pwd)
 
          rm -rf /tmp/veb
          cp -R "$WS" /tmp/veb
          chmod 755 /tmp/veb
          cd /tmp/veb
 
          export SYSDIR=/usr/src/sys
 
          make obj
          make WITHOUT_INVARIANTS=1
          make vebctl
